[package]
name = "container-web"
description = "WebAssembly bindings that let the browser UI play the Container engine and its computer opponents."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "container_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
container-engine = { path = "../container-engine" }
# No embedded nets: the page fetches the ones it needs and passes them to `load_net`.
container-bots = { path = "../container-bots", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.130"

# The native tests play every bot, so they build the nets in.
[dev-dependencies]
container-bots = { path = "../container-bots" }
