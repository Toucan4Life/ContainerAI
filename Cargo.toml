[workspace]
resolver = "3"
members = ["crates/container-engine", "crates/container-bots", "crates/container-web", "crates/container-arena", "crates/container-env"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

# The neural opponent does millions of multiply-adds per move, and unoptimised a single test game
# takes minutes. Everything else keeps the debug profile.
[profile.dev.package.container-bots]
opt-level = 3
