<!doctype html>
<meta charset="utf-8">
<title>Container · training dashboard</title>
<style>
  :root { --bg:#0f1720; --card:#17212c; --line:#2a3745; --fg:#e6edf3; --mute:#8b9bab; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:17px; margin:0 16px 0 0; }
  main { padding:16px 20px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(460px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--mute); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .wide { grid-column:1/-1; }
  .scroll { overflow-x:auto; }
  .stats { display:flex; gap:28px; flex-wrap:wrap; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--mute); font-size:12px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:#4cc38a; }
  select,label { color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  svg { width:100%; height:220px; display:block; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--mute); margin-top:4px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { text-align:right; padding:3px 8px; border-bottom:1px solid var(--line); } th:first-child,td:first-child { text-align:left; }
  th { color:var(--mute); font-weight:600; }
  .pill { padding:2px 8px; border-radius:10px; background:var(--line); font-size:12px; }
  .pill.running { background:#1f6f4a; }
</style>
<header>
  <h1>Container · training</h1>
  <select id="run"></select>
  <label><input type="checkbox" id="overlay"> overlay all runs</label>
  <label><input type="checkbox" id="live" checked> live</label>
  <span id="state"></span>
</header>
<main>
  <div class="card wide"><div class="stats" id="stats"></div><div class="bar"><i id="budget"></i></div></div>
  <div class="card wide"><h2>ELO over time <small>(anchored: Random = 0)</small></h2><svg id="c-elo"></svg><div class="legend" id="l-elo"></div></div>
  <div class="card"><h2>Win rate vs ladder opponents (greedy eval)</h2><svg id="c-win"></svg><div class="legend" id="l-win"></div></div>
  <div class="card" id="card-duel" style="display:none"><h2>Exploit duel <small>(every other seat plays the target)</small></h2><svg id="c-duel"></svg><div class="legend" id="l-duel"></div></div>
  <div class="card"><h2>Mean reward and stalled games</h2><svg id="c-reward"></svg><div class="legend" id="l-reward"></div></div>
  <div class="card"><h2>Policy / value loss</h2><svg id="c-loss"></svg><div class="legend" id="l-loss"></div></div>
  <div class="card"><h2>Entropy and KL</h2><svg id="c-ent"></svg><div class="legend" id="l-ent"></div></div>
  <div class="card"><h2>Throughput (games / second)</h2><svg id="c-gps"></svg></div>
  <div class="card"><h2>Ladder reference</h2><table id="ladder"></table></div>
  <div class="card wide scroll"><h2>Evaluations</h2><table id="evals"></table></div>
</main>
<script>
const COLORS = ["#4cc38a","#5aa9ff","#ffb454","#e06c75","#c792ea","#56d6d6","#f2e05c"];
const $ = (id) => document.getElementById(id);
const fmtT = (s) => s >= 3600 ? (s/3600).toFixed(1)+" h" : s >= 60 ? (s/60).toFixed(1)+" min" : Math.round(s)+" s";
let runs = [], data = {}, ladder = {};

async function api(p) { return (await fetch(p)).json(); }

function chart(svgId, series, opts = {}) {
  const svg = $(svgId), W = 800, H = 220, m = {l:48, r:10, t:8, b:22};
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pts = series.flatMap((s) => s.points);
  if (!pts.length) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="#8b9bab" text-anchor="middle">no data yet</text>`; return; }
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]).concat(opts.refs || []);
  let x0 = 0, x1 = Math.max(...xs, 1), y0 = opts.min ?? Math.min(...ys), y1 = opts.max ?? Math.max(...ys);
  if (y1 === y0) { y1 += 1; y0 -= 1; }
  const pad = (y1 - y0) * 0.05; if (opts.min === undefined) y0 -= pad; if (opts.max === undefined) y1 += pad;
  const X = (x) => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r), Y = (y) => H - m.b - (y - y0) / (y1 - y0) * (H - m.t - m.b);
  let out = "";
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = Y(v);
    out += `<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#2a3745"/><text x="${m.l-6}" y="${y+4}" fill="#8b9bab" font-size="11" text-anchor="end">${Math.abs(v)>=100?v.toFixed(0):v.toFixed(2)}</text>`;
    const t = x1 * i / 4;
    out += `<text x="${X(t)}" y="${H-6}" fill="#8b9bab" font-size="11" text-anchor="middle">${fmtT(t)}</text>`;
  }
  for (const r of opts.refs || []) out += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(r)}" y2="${Y(r)}" stroke="#8b9bab" stroke-dasharray="4 4"/>`;
  for (const s of series) {
    const d = s.points.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
    out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8"${s.dash ? ' stroke-dasharray="5 3"' : ""}/>`;
    if (s.dots) for (const p of s.points) out += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.color}"/>`;
  }
  svg.innerHTML = out;
}

function legend(id, series) {
  $(id).innerHTML = series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("");
}

const col = (rows, key) => rows.filter((r) => r[key] != null).map((r) => [r.t, r[key]]);
function smooth(points, k = 8) {
  return points.map((p, i) => { const w = points.slice(Math.max(0, i - k + 1), i + 1); return [p[0], w.reduce((a, q) => a + q[1], 0) / w.length]; });
}

function render() {
  const name = $("run").value, overlay = $("overlay").checked;
  const cur = data[name]; if (!cur) return;
  const rows = cur.metrics, train = rows.filter((r) => r.type === "train"), evals = rows.filter((r) => r.type === "eval" || r.type === "done");
  const st = cur.status || {}, pct = st.budget ? Math.min(100, 100 * st.elapsed / st.budget) : 0;
  const lastTrain = train[train.length - 1] || {};
  $("state").innerHTML = `<span class="pill ${st.state}">${st.state || "?"} · ${st.stage || ""}</span>`;
  $("stats").innerHTML = [
    ["Latest ELO", cur.last_elo ?? "–"], ["Best ELO", cur.best_elo ?? "–"],
    ["Games", (st.games ?? 0).toLocaleString()], ["Decisions", (st.decisions ?? 0).toLocaleString()],
    ["Games/s", lastTrain.games_per_sec != null ? lastTrain.games_per_sec.toFixed(1) : "–"],
    ["Elapsed", st.elapsed != null ? fmtT(st.elapsed) : "–"], ["Budget", st.budget ? fmtT(st.budget) : "–"],
    ["Remaining", st.budget ? fmtT(Math.max(0, st.budget - st.elapsed)) : "–"],
  ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  $("budget").style.width = pct + "%";

  const eloSeries = (overlay ? runs.map((r) => r.name) : [name]).map((n, i) => ({
    name: n, color: COLORS[i % COLORS.length], dots: true,
    points: col((data[n]?.metrics || []).filter((r) => r.type === "eval" || r.type === "done"), "elo"),
  }));
  const refs = Object.values(ladder);
  chart("c-elo", eloSeries, { refs });
  legend("l-elo", [...eloSeries, ...Object.entries(ladder).map(([k, v]) => ({ name: `${k} ${Math.round(v)} (dashed)`, color: "#8b9bab" }))]);

  const opps = [...new Set(evals.flatMap((e) => Object.keys(e).filter((k) => k.startsWith("vs_")).map((k) => k.slice(3))))];
  const win = opps.map((k, i) => ({ name: "vs " + k, color: COLORS[i], dots: true, points: col(evals, "vs_" + k) }));
  chart("c-win", win, { min: 0, max: 1, refs: [0.5] }); legend("l-win", win);
  const duelVs = [...new Set(evals.flatMap((e) => Object.keys(e).filter((k) => k.startsWith("duel_vs_"))))];
  $("card-duel").style.display = duelVs.length ? "" : "none";
  if (duelVs.length) {
    const duel = [...duelVs.map((k, i) => ({ name: "beats " + k.slice(8), color: COLORS[i], dots: true, points: col(evals, k) })),
      { name: "wins the game", color: COLORS[1], dots: true, points: col(evals, "duel_win_rate") },
      { name: "fair share of wins", color: COLORS[1], dash: true, points: col(evals, "duel_fair_rate") }];
    chart("c-duel", duel, { min: 0, max: 1, refs: [0.5] }); legend("l-duel", duel);
  }
  const rw = [{ name: "mean reward", color: COLORS[0], points: smooth(col(train, "mean_reward")) },
    { name: "stalled games (share of 256)", color: COLORS[3], points: smooth(col(train, "stalled").map(([t, v]) => [t, v / 256])) }];
  chart("c-reward", rw); legend("l-reward", rw);
  const loss = [{ name: "policy", color: COLORS[1], points: smooth(col(train, "loss_pi")) }, { name: "value", color: COLORS[2], points: smooth(col(train, "loss_v")) }];
  chart("c-loss", loss); legend("l-loss", loss);
  const ent = [{ name: "entropy", color: COLORS[4], points: smooth(col(train, "entropy")) }, { name: "KL", color: COLORS[3], points: smooth(col(train, "kl")) }];
  chart("c-ent", ent); legend("l-ent", ent);
  chart("c-gps", [{ name: "games/s", color: COLORS[5], points: smooth(col(train, "games_per_sec")) }], { min: 0 });

  $("ladder").innerHTML = "<tr><th>Bot</th><th>ELO</th></tr>" + Object.entries(ladder).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${k}</td><td>${Math.round(v)}</td></tr>`).join("");
  const duelCols = [...new Set(evals.flatMap((e) => Object.keys(e).filter((k) => k.startsWith("duel_"))))];
  const cols = ["elo", ...opps.map((k) => "vs_" + k), ...duelCols, "games"];
  $("evals").innerHTML = "<tr><th>Time</th><th>Stage</th>" + cols.map((c) => `<th>${c}</th>`).join("") + "</tr>" +
    evals.slice().reverse().map((e) => `<tr><td>${fmtT(e.t)}</td><td>${e.stage || e.type}</td>` + cols.map((c) => `<td>${e[c] ?? ""}</td>`).join("") + "</tr>").join("");
}

async function refresh() {
  runs = await api("/api/runs"); ladder = await api("/api/ladder");
  const sel = $("run"), keep = sel.value;
  sel.innerHTML = runs.map((r) => `<option>${r.name}</option>`).join("");
  if (runs.some((r) => r.name === keep)) sel.value = keep;
  const names = $("overlay").checked ? runs.map((r) => r.name) : sel.value ? [sel.value] : [];
  await Promise.all(names.map(async (n) => { data[n] = await api("/api/run/" + encodeURIComponent(n)); }));
  render();
}
$("run").onchange = $("overlay").onchange = refresh;
refresh();
setInterval(() => { if ($("live").checked) refresh(); }, 3000);
</script>
